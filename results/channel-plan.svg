<g font-family="Arial, sans-serif" fill="#193d35">
<text x="32" y="44" font-size="26" font-weight="700">Outreach tied to intake capacity</text>
<text x="32" y="72" font-size="15" fill="#52645a">BridgePath Adult Learning · Fictional eight-week planning exercise</text>
<rect x="32" y="100" width="288" height="104" rx="10" fill="#e3ebdf"/><text x="50" y="146" font-size="30" font-weight="700">17.74</text><text x="50" y="177" font-size="14">Expected first-session starts</text>
<rect x="344" y="100" width="288" height="104" rx="10" fill="#e3ebdf"/><text x="362" y="146" font-size="30" font-weight="700">$1,440.00</text><text x="362" y="177" font-size="14">Allocated cash, including reserve</text>
<rect x="656" y="100" width="288" height="104" rx="10" fill="#e3ebdf"/><text x="674" y="146" font-size="30" font-weight="700">53.73 h</text><text x="674" y="177" font-size="14">Outreach and intake staff time</text>
<text x="32" y="246" font-size="18" font-weight="700">Expected starts by selected channel</text>
