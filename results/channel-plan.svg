<text x="870" y="356" font-size="16" font-weight="700">0.00</text>
<text x="32" y="409" font-size="16">Paid search test</text><rect x="260" y="386" width="590" height="34" rx="5" fill="#e3e8e2"/>
<rect x="260" y="386" width="110.941" height="34" rx="5" fill="#2d6a58"/>
<text x="870" y="409" font-size="16" font-weight="700">2.63</text>
