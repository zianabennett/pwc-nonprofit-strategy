<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">Outreach tied to intake capacity</title>
<desc id="desc">Fictional BridgePath planning model. Selected mix forecasts 17.74 first-session starts with $1,440.00 allocated and 53.73 staff hours. Lower partner attendance changes the preferred channel mix.</desc>
